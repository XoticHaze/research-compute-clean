name: Opaque Capsule Protocol CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Reject data and non-allowlisted files from source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
              'docs/opaque-compute-profile-v1.md',
              'scripts/opaque_bidirectional_capsule_v1.py',
              'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              'scripts/opaque_bidirectional_capsule_smoke_v1.py',
              'tests/test_opaque_bidirectional_capsule_v1.py',
              'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              '.github/workflows/opaque-capsule-protocol-ci.yml',
          }
          actual=set(subprocess.check_output(
              ['git','ls-tree','-r','--name-only','HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit('CLEAN_ROOM_SOURCE_ALLOWLIST=FAIL_CLOSED')
          print('CLEAN_ROOM_SOURCE_ALLOWLIST=PASS')
          PY
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Compile and run positive and fail-closed crypto regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            scripts/opaque_bidirectional_capsule_v1.py \
            scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py \
            scripts/opaque_bidirectional_capsule_smoke_v1.py
          python -B -m unittest -q \
            tests.test_opaque_bidirectional_capsule_v1 \
            tests.test_opaque_bidirectional_capsule_p256_aesgcm_v1
      - name: Execute encrypted request and runtime-private-canary return
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py
      - name: Prove isolated worker key custody and encrypted two-process handoff
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          # Do not permit an ephemeral plaintext synthetic workload to reach guest swap.
          sudo -n swapoff -a || { echo "CLEAN_ROOM_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process-tamper
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process-wrong-run
      - name: Admit run-bound synthetic request from independent private producer
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'security/clean-external-probe-') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n swapoff -a || { echo "CLEAN_EXTERNAL_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --external-synthetic-worker
      - name: Fail closed if generated public artifact contains non-envelope data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from scripts.opaque_bidirectional_capsule_v1 import BUCKETS, FIELDS, SCHEMA
          from scripts.opaque_bidirectional_capsule_p256_aesgcm_v1 import SCHEMA as P256_SCHEMA
          data=Path('opaque-result-envelope.json').read_bytes()
          if len(data)>1_500_000:
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          x=json.loads(data)
          if (set(x)!=FIELDS or x['schema'] not in {SCHEMA,P256_SCHEMA}
                  or x['run_id']!=os.environ['GITHUB_RUN_ID']
                  or x['direction']!='result'):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          if not x['recipient_key_id'].startswith('sha256:'):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          sender=base64.b64decode(x['sender_public_b64'],validate=True)
          nonce=base64.b64decode(x['nonce_b64'],validate=True)
          cipher=base64.b64decode(x['ciphertext_b64'],validate=True)
          if (len(sender)!=32 or len(nonce)!=12 or
                  len(cipher)-16 not in BUCKETS or
                  hashlib.sha256(cipher).hexdigest()!=x['ciphertext_sha256']):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          print('CLEAN_ROOM_ARTIFACT_CIPHERTEXT_ONLY=PASS')
          PY
      - name: Upload one-day encrypted envelope only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
          retention-days: 1


  # A separate public Actions job audits what GitHub actually published by
  # reading the completed protocol job log and uploaded artifact through API.
  # No source private key or canary is transferred to this auditor.
  audit_publication:
    name: audit-publication
    needs: [protocol]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Independently inspect public job log and artifact through GitHub API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          # This job never receives the runtime-only canary or a private key.
          # Do not echo remote content, URLs, HTTP errors, tokens or artifacts.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def read_bounded(response, limit):
              with response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise ValueError("response_size")
              return data

          def request(path):
              return urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "User-Agent": "clean-publication-auditor-v1",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

          def api_json(path):
              with urllib.request.urlopen(request(path), timeout=20) as resp:
                  return json.load(resp)

          def download_without_forwarding_token(path, limit):
              # GitHub sends a short-lived signed URL for log/artifact bytes.
              # Never forward the Actions token to that redirected host.
              try:
                  with urllib.request.build_opener(NoRedirect()).open(
                      request(path), timeout=20,
                  ):
                      raise ValueError("expected_redirect")
              except urllib.error.HTTPError as exc:
                  if exc.code not in (302, 307):
                      raise
                  location = exc.headers.get("Location")
              if not location:
                  raise ValueError("missing_location")
              parts = urllib.parse.urlsplit(location)
              if (parts.scheme != "https" or not parts.hostname
                      or parts.username or parts.password):
                  raise ValueError("invalid_location")
              return read_bounded(
                  urllib.request.urlopen(
                      urllib.request.Request(
                          location, headers={"User-Agent": "clean-publication-auditor-v1"}
                      ), timeout=30,
                  ), limit,
              )

          def publication_retry(fn):
              # A just-completed GitHub job/artifact may be indexed slightly
              # after the dependent audit job starts. Never retry auth errors.
              for attempt in range(5):
                  try:
                      return fn()
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (404, 425, 502, 503) or attempt == 4:
                          raise
                      time.sleep(2)

          def no_duplicate_keys(pairs):
              obj = {}
              for key, value in pairs:
                  if key in obj:
                      raise ValueError("duplicate_public_key")
                  obj[key] = value
              return obj

          STAGE = ["START"]

          def audit():
              repo = os.environ["REPO"]
              run_id = os.environ["RUN_ID"]
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  raise ValueError("repo")
              if not re.fullmatch(r"[0-9]{1,24}", run_id):
                  raise ValueError("run")
              prefix = "/repos/" + repo
              STAGE[0] = "JOBS_API"
              jobs = api_json(prefix + "/actions/runs/" + run_id + "/jobs?per_page=100")
              if jobs.get("total_count", 0) > 100:
                  raise ValueError("unbounded_jobs")
              protocol_jobs = [
                  j for j in jobs["jobs"]
                  if j.get("name") == "protocol"
                  and j.get("status") == "completed"
                  and j.get("conclusion") == "success"
              ]
              if len(protocol_jobs) != 1:
                  raise ValueError("protocol_job")
              STAGE[0] = "LOG_API"
              logs = publication_retry(lambda: download_without_forwarding_token(
                  prefix + "/actions/jobs/" + str(protocol_jobs[0]["id"]) + "/logs",
                  1_500_000,
              ))
              # These tests recognize runtime-derived canary material and common
              # private-key/token patterns without needing their actual values.
              STAGE[0] = "LOG_PATTERN"
              forbidden = (
                  rb"PRIVATE-RUNTIME-CANARY-[0-9a-f]{64}",
                  rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
                  rb"github_pat_[A-Za-z0-9_]{20,}",
                  rb"gh[pousr]_[A-Za-z0-9_]{30,}",
              )
              if any(re.search(pattern, logs) for pattern in forbidden):
                  raise ValueError("log_private_pattern")
              if b"OPAQUE_CAPSULE_PROTOCOL_PASS=1" not in logs:
                  raise ValueError("missing_protocol_receipt")
              if b"CLEAN_ROOM_ARTIFACT_CIPHERTEXT_ONLY=PASS" not in logs:
                  raise ValueError("missing_artifact_receipt")
              if b"CLEAN_ROOM_PRIVATE_CONSUMER_DURABLE_ACK=0" not in logs:
                  raise ValueError("missing_ack_boundary")

              STAGE[0] = "ARTIFACT_LIST_API"
              for attempt in range(5):
                  listing = publication_retry(lambda: api_json(
                      prefix + "/actions/runs/" + run_id + "/artifacts?per_page=100"
                  ))
                  if listing.get("total_count") != 0 or attempt == 4:
                      break
                  time.sleep(2)
              artifacts = listing.get("artifacts", [])
              if listing.get("total_count") != 1 or len(artifacts) != 1:
                  raise ValueError("unexpected_artifacts")
              artifact = artifacts[0]
              if artifact.get("name") != "opaque-result-envelope" or artifact.get("expired"):
                  raise ValueError("artifact_name")
              STAGE[0] = "ARTIFACT_ZIP_API"
              archive = publication_retry(lambda: download_without_forwarding_token(
                  prefix + "/actions/artifacts/" + str(artifact["id"]) + "/zip",
                  1_500_000,
              ))
              STAGE[0] = "ARTIFACT_ZIP_SHAPE"
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  if bundle.namelist() != ["opaque-result-envelope.json"]:
                      raise ValueError("artifact_zip_members")
                  member = bundle.infolist()[0]
                  if member.file_size > 1_500_000 or member.is_dir():
                      raise ValueError("artifact_member_size")
                  obj = json.loads(bundle.read(member), object_pairs_hook=no_duplicate_keys)
              STAGE[0] = "ENVELOPE_SHAPE"
              allowed = {
                  "schema", "run_id", "direction", "recipient_key_id",
                  "sender_public_b64", "nonce_b64", "ciphertext_b64",
                  "ciphertext_sha256",
              }
              if (not isinstance(obj, dict) or set(obj) != allowed
                      or obj["schema"] != "opaque-capsule-v1"
                      or obj["direction"] != "result" or obj["run_id"] != run_id
                      or not isinstance(obj["recipient_key_id"], str)
                      or not obj["recipient_key_id"].startswith("sha256:")):
                  raise ValueError("public_envelope_shape")
              STAGE[0] = "ENVELOPE_CRYPTO_SHAPE"
              sender = base64.b64decode(obj["sender_public_b64"], validate=True)
              nonce = base64.b64decode(obj["nonce_b64"], validate=True)
              ciphertext = base64.b64decode(obj["ciphertext_b64"], validate=True)
              if (len(sender) != 32 or len(nonce) != 12
                      or len(ciphertext) - 16 not in (4096, 16384, 65536, 262144, 1048576)
                      or hashlib.sha256(ciphertext).hexdigest() != obj["ciphertext_sha256"]):
                  raise ValueError("public_ciphertext_integrity")

          try:
              audit()
          except Exception:
              print("CLEAN_ROOM_INDEPENDENT_PUBLICATION_AUDIT=FAIL_CLOSED_STAGE_" + STAGE[0])
              sys.exit(1)
          print("CLEAN_ROOM_INDEPENDENT_PUBLICATION_AUDIT=PASS")
          PY

  # Only trusted base/main source is ever executed with job-scoped contents
  # write permission. Never checkout a PR head or use PR-owned scripts here.
  external_synthetic_exchange:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'security/clean-external-probe-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted clean main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify trusted seven-file source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
              'docs/opaque-compute-profile-v1.md',
              'scripts/opaque_bidirectional_capsule_v1.py',
              'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              'scripts/opaque_bidirectional_capsule_smoke_v1.py',
              'tests/test_opaque_bidirectional_capsule_v1.py',
              'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              '.github/workflows/opaque-capsule-protocol-ci.yml',
          }
          found=set(subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines())
          if found!=expected:
              raise SystemExit('CLEAN_EXTERNAL_TRUSTED_SOURCE=FAIL_CLOSED')
          print('CLEAN_EXTERNAL_TRUSTED_SOURCE=PASS')
          PY
      - name: Install exact crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Publish one-run public offer and consume bounded encrypted synthetic input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n swapoff -a || { echo "CLEAN_EXTERNAL_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --external-synthetic-worker-publish
      - name: Upload ciphertext-only one-day external result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-external-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
          retention-days: 1
