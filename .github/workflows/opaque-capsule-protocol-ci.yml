name: Opaque Capsule Protocol CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/opaque_bidirectional_capsule_v1.py'
      - 'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'scripts/opaque_bidirectional_capsule_smoke_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_v1.py'
      - 'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py'
      - 'docs/opaque-compute-profile-v1.md'
      - '.github/workflows/opaque-capsule-protocol-ci.yml'
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Reject data and non-allowlisted files from source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
              'docs/opaque-compute-profile-v1.md',
              'scripts/opaque_bidirectional_capsule_v1.py',
              'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              'scripts/opaque_bidirectional_capsule_smoke_v1.py',
              'tests/test_opaque_bidirectional_capsule_v1.py',
              'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              '.github/workflows/opaque-capsule-protocol-ci.yml',
          }
          actual=set(subprocess.check_output(
              ['git','ls-tree','-r','--name-only','HEAD'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit('CLEAN_ROOM_SOURCE_ALLOWLIST=FAIL_CLOSED')
          print('CLEAN_ROOM_SOURCE_ALLOWLIST=PASS')
          PY
      - name: Install fixed crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Compile and run positive and fail-closed crypto regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            scripts/opaque_bidirectional_capsule_v1.py \
            scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py \
            scripts/opaque_bidirectional_capsule_smoke_v1.py
          python -B -m unittest -q \
            tests.test_opaque_bidirectional_capsule_v1 \
            tests.test_opaque_bidirectional_capsule_p256_aesgcm_v1
      - name: Execute encrypted request and runtime-private-canary return
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py
      - name: Prove isolated worker key custody and encrypted two-process handoff
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          # Do not permit an ephemeral plaintext synthetic workload to reach guest swap.
          sudo -n swapoff -a || { echo "CLEAN_ROOM_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process-tamper
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --two-process-wrong-run
      - name: Admit run-bound synthetic request from independent private producer
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'security/clean-external-probe-') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n swapoff -a || { echo "CLEAN_EXTERNAL_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --external-synthetic-worker
      - name: Fail closed if generated public artifact contains non-envelope data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os
          from pathlib import Path
          from scripts.opaque_bidirectional_capsule_v1 import BUCKETS, FIELDS, SCHEMA
          from scripts.opaque_bidirectional_capsule_p256_aesgcm_v1 import SCHEMA as P256_SCHEMA
          data=Path('opaque-result-envelope.json').read_bytes()
          if len(data)>1_500_000:
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          x=json.loads(data)
          if (set(x)!=FIELDS or x['schema'] not in {SCHEMA,P256_SCHEMA}
                  or x['run_id']!=os.environ['GITHUB_RUN_ID']
                  or x['direction']!='result'):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          if not x['recipient_key_id'].startswith('sha256:'):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          sender=base64.b64decode(x['sender_public_b64'],validate=True)
          nonce=base64.b64decode(x['nonce_b64'],validate=True)
          cipher=base64.b64decode(x['ciphertext_b64'],validate=True)
          if (len(sender)!=32 or len(nonce)!=12 or
                  len(cipher)-16 not in BUCKETS or
                  hashlib.sha256(cipher).hexdigest()!=x['ciphertext_sha256']):
              raise SystemExit('CLEAN_ROOM_ARTIFACT=REJECTED')
          print('CLEAN_ROOM_ARTIFACT_CIPHERTEXT_ONLY=PASS')
          PY
      - name: Upload one-day encrypted envelope only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
          retention-days: 1

  # Only trusted base/main source is ever executed with job-scoped contents
  # write permission. Never checkout a PR head or use PR-owned scripts here.
  external_synthetic_exchange:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'security/clean-external-probe-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout trusted clean main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Verify trusted seven-file source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
              'docs/opaque-compute-profile-v1.md',
              'scripts/opaque_bidirectional_capsule_v1.py',
              'scripts/opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              'scripts/opaque_bidirectional_capsule_smoke_v1.py',
              'tests/test_opaque_bidirectional_capsule_v1.py',
              'tests/test_opaque_bidirectional_capsule_p256_aesgcm_v1.py',
              '.github/workflows/opaque-capsule-protocol-ci.yml',
          }
          found=set(subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines())
          if found!=expected:
              raise SystemExit('CLEAN_EXTERNAL_TRUSTED_SOURCE=FAIL_CLOSED')
          print('CLEAN_EXTERNAL_TRUSTED_SOURCE=PASS')
          PY
      - name: Install exact crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.1
      - name: Publish one-run public offer and consume bounded encrypted synthetic input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ulimit -c 0
          sudo -n swapoff -a || { echo "CLEAN_EXTERNAL_GUEST_SWAP=FAIL_CLOSED"; exit 1; }
          python -B scripts/opaque_bidirectional_capsule_smoke_v1.py --external-synthetic-worker-publish
      - name: Upload ciphertext-only one-day external result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-external-result-envelope
          path: opaque-result-envelope.json
          if-no-files-found: error
          retention-days: 1
